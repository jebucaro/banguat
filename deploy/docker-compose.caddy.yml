# Caddy TLS edge overlay for the Banguat.ExchangeRates demo.
#
# Layered on top of the Aspire-generated aspire-output/docker-compose.yaml at
# deploy time. Run from the repo root with --project-directory so relative
# paths (the Caddyfile mount) resolve correctly regardless of where the
# generated compose file lives:
#
#   docker compose \
#     --project-directory . \
#     -f src/Banguat.ExchangeRates.AppHost/aspire-output/docker-compose.yaml \
#     -f deploy/docker-compose.caddy.yml \
#     --env-file src/Banguat.ExchangeRates.AppHost/aspire-output/.env.<environment> \
#     up -d
#
# (On the VPS you typically copy the generated compose + .env + the deploy/
#  directory together; adjust the -f paths to match the layout you copy.)
#
# This file is hand-maintained deployment infrastructure. It does NOT edit the
# generated compose output; it only adds the Caddy edge and overrides the
# gateway/dashboard host-port bindings so that Caddy is the only publicly
# reachable service.
#
# Required environment variables (supply via the --env-file or the shell):
#   DEMO_DOMAIN   e.g. demo.example.com  (must have a DNS A record to this host)
#   ACME_EMAIL    e.g. you@example.com   (Let's Encrypt account / expiry notices)

services:
  caddy:
    image: "caddy:2"
    restart: "always"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DEMO_DOMAIN: "${DEMO_DOMAIN}"
      ACME_EMAIL: "${ACME_EMAIL}"
    volumes:
      - "${CADDYFILE_PATH:-./deploy/Caddyfile}:/etc/caddy/Caddyfile:ro"
      - "caddy_data:/data" # issued certificates + ACME account (persist across restarts)
      - "caddy_config:/config"
    networks:
      - "aspire"
    depends_on:
      - "gateway"

  # Keep the app gateway reachable by Caddy on the internal network, but not
  # published to the public interface. Bind its host port to loopback so only
  # Caddy terminates public traffic. (Aspire generates `ports: - "${GATEWAY_PORT}"`;
  # this override pins the host side to 127.0.0.1.)
  gateway:
    ports:
      - "127.0.0.1:${GATEWAY_PORT}:${GATEWAY_PORT}"

  # The Aspire telemetry dashboard is useful during the demo but should not be
  # publicly exposed; bind it to loopback (reach it over an SSH tunnel).
  compose-dashboard:
    ports:
      - "127.0.0.1:18888:18888"

volumes:
  caddy_data:
  caddy_config:
